name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag matches addon.xml
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match addon.xml version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # The folder inside the zip must be named like the add-on ID, otherwise Kodi refuses it
      - name: Build zip
        run: git archive --format=zip --prefix=script.reboottoandroid/ -o "script.reboottoandroid-${{ steps.version.outputs.version }}.zip" HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: script.reboottoandroid-${{ steps.version.outputs.version }}
          path: script.reboottoandroid-*.zip

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" script.reboottoandroid-*.zip --title "$GITHUB_REF_NAME" --generate-notes
